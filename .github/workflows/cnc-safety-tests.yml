name: CNC app safety tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [improve/architecture-and-data-safety]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile application modules
        run: python -m compileall -q app.py backup_manager.py tests
      - name: Run data safety tests
        run: python -m unittest discover -s tests -v
